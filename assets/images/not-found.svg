<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Ground lines -->
  <line x1="60" y1="340" x2="200" y2="340" stroke="#C0603C" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="350" x2="160" y2="350" stroke="#C0603C" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="340" x2="540" y2="340" stroke="#C0603C" stroke-width="3" stroke-linecap="round"/>
  <line x1="420" y1="350" x2="510" y2="350" stroke="#C0603C" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="345" x2="380" y2="345" stroke="#C0603C" stroke-width="2" stroke-linecap="round"/>

  <!-- Left "4" -->
  <g transform="translate(60, 80)">
    <path d="M90 0 L0 180 L130 180" stroke="#C0603C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M100 80 L100 260" stroke="#C0603C" stroke-width="24" stroke-linecap="round"/>
    <!-- Fill shape for the 4 -->
    <path d="M90 10 L10 178 L90 178 Z" fill="#C0603C" opacity="0.15"/>
  </g>

  <!-- Center "0" -->
  <g transform="translate(220, 80)">
    <ellipse cx="80" cy="130" rx="75" ry="130" stroke="#C0603C" stroke-width="24" fill="none"/>
    <ellipse cx="80" cy="130" rx="55" ry="110" fill="#C0603C" opacity="0.12"/>
  </g>

  <!-- Right "4" -->
  <g transform="translate(380, 80)">
    <path d="M90 0 L0 180 L130 180" stroke="#C0603C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M100 80 L100 260" stroke="#C0603C" stroke-width="24" stroke-linecap="round"/>
    <path d="M90 10 L10 178 L90 178 Z" fill="#C0603C" opacity="0.15"/>
  </g>

  <!-- Character body (sitting on the 0) -->
  <g transform="translate(260, 50)">
    <!-- Body outline -->
    <ellipse cx="40" cy="80" rx="28" ry="42" stroke="#9ca3af" stroke-width="2.5" fill="#f9fafb"/>
    <!-- Head -->
    <circle cx="40" cy="28" r="24" stroke="#9ca3af" stroke-width="2.5" fill="#f9fafb"/>
    <!-- Sad face -->
    <circle cx="32" cy="24" r="2" fill="#9ca3af"/>
    <circle cx="48" cy="24" r="2" fill="#9ca3af"/>
    <path d="M32 36 Q40 30 48 36" stroke="#9ca3af" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms hanging down sadly -->
    <path d="M14 70 Q0 100 8 120" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M66 70 Q80 100 72 120" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M28 118 L22 155" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M52 118 L58 155" stroke="#9ca3af" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Hat/cap -->
    <path d="M18 14 Q40 -8 62 14" stroke="#C0603C" stroke-width="3" fill="#C0603C" opacity="0.3"/>
    <rect x="32" y="2" width="16" height="6" rx="3" fill="#C0603C" opacity="0.6"/>
  </g>
</svg>
